version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tpp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tpp
      POSTGRES_PASSWORD: tpp_secret
      POSTGRES_DB: tpp_protocol
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpp -d tpp_protocol"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tpp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Run migrations on startup
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://tpp:tpp_secret@postgres:5432/tpp_protocol
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
