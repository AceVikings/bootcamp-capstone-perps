version: "3.9"

# IMAGE_TAG is injected by CI/CD (github.sha).  Falls back to "latest" for
# local development: `IMAGE_TAG=latest docker-compose up`
x-app-image: &app-image
  image: ${REGISTRY}/${GCP_PROJECT_ID}/fractal/backend:${IMAGE_TAG:-latest}

services:
  # ── Infrastructure (started once; NEVER recreated by CI) ───────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tpp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tpp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tpp_protocol}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tpp} -d ${POSTGRES_DB:-tpp_protocol}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tpp_redis
    restart: unless-stopped
    # Enable AOF persistence so data survives container restarts
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Application services (recreated on every deploy) ───────────────────────
  fractal-api:
    <<: *app-image
    container_name: fractal_api
    restart: unless-stopped
    command: ["/usr/local/bin/fractal-api"]
    env_file: .env
    environment:
      # Keeper keypair for the devnet USDC faucet endpoint.
      # The file is placed on the VM at this path (never committed to git).
      - KEEPER_KEYPAIR_PATH=/run/secrets/tpp-devnet.json
      - RUST_LOG=info
    volumes:
      - /opt/fractal/tpp-devnet.json:/run/secrets/tpp-devnet.json:ro
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fractal-indexer:
    <<: *app-image
    container_name: fractal_indexer
    restart: unless-stopped
    command: ["/usr/local/bin/fractal-indexer"]
    env_file: .env
    environment:
      - RUST_LOG=info,fractal_indexer=debug
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  # Named volumes are NEVER deleted by `docker-compose up/down` (only by
  # `docker-compose down -v` which the CI workflow explicitly avoids).
  postgres_data:
  redis_data:
