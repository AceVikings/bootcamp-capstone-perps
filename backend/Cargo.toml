[workspace]
members = [
    "crates/common",
    "crates/db",
    "crates/indexer",
    "crates/matcher",
    "crates/api",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Fractal Markets Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }

# Database
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio-native-tls",
    "uuid",
    "chrono",
    "migrate",
    "json",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Solana
solana-client = "3"
solana-sdk = "3"
solana-account-decoder = "3"
solana-transaction-status = "3"
solana-commitment-config = "3"

# Crypto / encoding
bs58 = "0.5"
base64 = "0.22"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["serde"] }
borsh = { version = "1", features = ["derive"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
config = "0.14"
dotenvy = "0.15"
async-trait = "0.1"
futures = "0.3"
