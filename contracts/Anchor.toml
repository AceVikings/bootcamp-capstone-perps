[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
tpp_protocol = "9iUeMGw14CaAiASMUruBMWRR5j7HcEXwthuN5pDAo3Qf"

# Devnet: deploy keypair lives at target/deploy/tpp_protocol-keypair.json
# To deploy: anchor deploy --provider.cluster devnet
[programs.devnet]
tpp_protocol = "9iUeMGw14CaAiASMUruBMWRR5j7HcEXwthuN5pDAo3Qf"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/tpp-devnet.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Build for localnet (default, mock oracle):
#   anchor build
#
# Build for devnet / mainnet (Pyth pull-oracle, mock instruction excluded):
#   anchor build --no-default-features --features devnet
#
# Pyth pull-oracle: Receiver program (same address on devnet + mainnet):
#   rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ
#
# Pyth pull-oracle: set epoch asset_key to the feed-ID bytes (as a Pubkey):
#   SOL/USD : ef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d
#   BTC/USD : e62df6c8b4a85fe1a67db44dc12de5db330f7ac66b72dc658afedf0f4a415b43
#   ETH/USD : ff61491a931112ddf1bd8147cd1b641375f79f5825126d665480874634fd0ace
#
# Before each oracle instruction: fetch a fresh VAA from Hermes and post it:
#   https://hermes.pyth.network/v2/updates/price/latest?ids[]=<feed_id_hex>
