[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
tpp_protocol = "9iUeMGw14CaAiASMUruBMWRR5j7HcEXwthuN5pDAo3Qf"

# Devnet: deploy keypair lives at target/deploy/tpp_protocol-keypair.json
# To deploy: anchor deploy --provider.cluster devnet
[programs.devnet]
tpp_protocol = "9iUeMGw14CaAiASMUruBMWRR5j7HcEXwthuN5pDAo3Qf"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Build for localnet (default, mock oracle):
#   anchor build
#
# Build for devnet (Pyth oracle, no mock instruction):
#   anchor build --no-default-features --features devnet
